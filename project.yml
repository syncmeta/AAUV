name: AAUV
options:
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
targets:
  AAUV:
    type: application
    platform: [iOS, macOS]
    sources:
      - Sources
      - Resources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY.md
        buildPhase: resources
      - path: Licenses
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: AAUV
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.aauv
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: AAUV-App-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: AAUV-App-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: AAUV-App-macOS.entitlements
    dependencies:
      - sdk: libsqlite3.tbd
      - package: MarkdownUI
        product: MarkdownUI
      - package: SwiftMath
        product: SwiftMath
      - framework: Vendor/AAUVCore.xcframework
        embed: false
      - target: Tunnel
        platforms: [iOS]
      - target: AAUVShare
        platforms: [iOS]
    postBuildScripts:
      - name: Bundle sing-box on macOS
        script: |
          if [ "$PLATFORM_NAME" = macosx ]; then
            "$SRCROOT/Scripts/embed-sing-box.sh"
          fi
        basedOnDependencyAnalysis: false
      - name: Bundle Copilot on macOS
        script: |
          if [ "$PLATFORM_NAME" = macosx ]; then
            "$SRCROOT/Scripts/embed-copilot.sh"
          fi
        basedOnDependencyAnalysis: false
  Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - path: LICENSE
        buildPhase: resources
      - path: Licenses/AAUV-Distribution.txt
        buildPhase: resources
      - path: Vendor/sing-box-LICENSE
        buildPhase: resources
      - path: Licenses/GPL-3.0.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.aauv.Tunnel
        SKIP_INSTALL: YES
    info:
      path: TunnelInfo.plist
      properties:
        CFBundleDisplayName: AAUV sing-box
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: AAUV-iOS.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - framework: Vendor/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: UIKit.framework
  AAUVShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - Sources/ShareInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.aauv.Share
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: ShareInfo.plist
      properties:
        CFBundleDisplayName: AAUV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item,
              SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.data" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.content").@count > 0).@count > 0
    entitlements:
      path: AAUV-Share-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.pendingname.aauv]
